# vid2eu production stack. Configure with `sh scripts/setup.sh` (writes .env, offers to
# start it). Every ${VAR} below can be set in .env.
#
# The vid2eu services run the prebuilt images ${VID2EU_IMAGE}-<service>:${VID2EU_TAG}.
# In a source checkout, docker-compose.override.yml (loaded automatically) builds them
# from the source instead.
#
#   web ──/api──────────────▶ api ──▶ storage (deletes)
#    │  └/storage/upload──▶ storage ──▶ transcoder (enqueue)
#    └/v/:slug/* media ────▶ storage
#   api, storage, transcoder, migrate ──▶ postgres
#   storage + transcoder share the storage volume
#
# Only the web server is meant to face visitors; the API can optionally be published
# for a separate API domain. storage, transcoder and postgres stay on the private network.

name: ${COMPOSE_PROJECT_NAME:-vid2eu}

x-db-env: &db-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-vid2eu}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (run sh scripts/setup.sh)}
  POSTGRES_DB: ${POSTGRES_DB:-vid2eu}

# `fetch` is in every Node image, so no curl/wget needed for health checks
x-healthcheck: &healthcheck
  test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 20s

x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: "${LOG_MAX_FILES:-5}"

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vid2eu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (run sh scripts/setup.sh)}
      POSTGRES_DB: ${POSTGRES_DB:-vid2eu}
    volumes:
      - ${POSTGRES_DATA:-postgres-data}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  migrate:
    image: ${VID2EU_IMAGE:-vid2eu}-migrate:${VID2EU_TAG:-latest}
    restart: "no"
    environment:
      <<: *db-env
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  api:
    image: ${VID2EU_IMAGE:-vid2eu}-api:${VID2EU_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *db-env
      NODE_ENV: production
      PORT: ${API_PORT:-3000}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (run sh scripts/setup.sh)}
      STORAGE_API: http://storage:${STORAGE_PORT:-3001}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      MAX_UPLOAD_SIZE_GB: ${MAX_UPLOAD_SIZE_GB:-10}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD (run sh scripts/setup.sh)}
      ADMIN_STORAGE_GB: ${ADMIN_STORAGE_GB:-20}
    ports:
      - "${API_BIND:-127.0.0.1}:${API_HOST_PORT:-3000}:${API_PORT:-3000}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck: *healthcheck
    logging: *logging

  storage:
    image: ${VID2EU_IMAGE:-vid2eu}-storage:${VID2EU_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *db-env
      NODE_ENV: production
      PORT: ${STORAGE_PORT:-3001}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (run sh scripts/setup.sh)}
      STORAGE_ROOT: /data/storage
      TRANSCODER_API_URL: http://transcoder:${TRANSCODER_PORT:-3002}
      MAX_UPLOAD_SIZE_GB: ${MAX_UPLOAD_SIZE_GB:-10}
    volumes:
      - ${STORAGE_DATA:-storage-data}:/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck: *healthcheck
    logging: *logging

  transcoder:
    image: ${VID2EU_IMAGE:-vid2eu}-transcoder:${VID2EU_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *db-env
      NODE_ENV: production
      PORT: ${TRANSCODER_PORT:-3002}
      STORAGE_ROOT: /data/storage
      TRANSCODER_CONCURRENCY: ${TRANSCODER_CONCURRENCY:-1}
    volumes:
      - ${STORAGE_DATA:-storage-data}:/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck: *healthcheck
    # each concurrent job runs ffmpeg on all cores; TRANSCODER_CONCURRENCY=1 suits most hosts
    logging: *logging

  web:
    image: ${VID2EU_IMAGE:-vid2eu}-web:${VID2EU_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${WEB_PORT:-8080}
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL (run sh scripts/setup.sh)}
      INTERNAL_API_URL: http://api:${API_PORT:-3000}
      INTERNAL_STORAGE_URL: http://storage:${STORAGE_PORT:-3001}
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_HOST_PORT:-8080}:${WEB_PORT:-8080}"
    depends_on:
      api:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
    logging: *logging

volumes:
  postgres-data:
  storage-data:
